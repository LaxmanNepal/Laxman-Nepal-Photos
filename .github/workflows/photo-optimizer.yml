name: Optimize Photos to WebP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photo-optimization
  cancel-in-progress: false

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: compress photos and convert to WebP')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Sharp
        run: npm install --no-save sharp@0.34.3

      - name: Optimize images
        env:
          MAX_WIDTH: 2400
          WEBP_QUALITY: 84
          THUMB_WIDTH: 480
          THUMB_QUALITY: 76
          MEDIUM_WIDTH: 1200
          MEDIUM_QUALITY: 82
          MIN_SAVINGS: 0.03
        run: node scripts/optimize-images.js

      - name: Verify WebP output
        run: |
          set -e
          count=$(find Images -type f -name '*.webp' ! -name '*-thumb.webp' ! -name '*-medium.webp' | wc -l)
          echo "Optimized WebP files: $count"
          test "$count" -gt 0

      - name: Generate photo index
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path('Images')
          out = []
          exts = {'.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp', '.avif'}

          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              if re.search(r'(?:-thumb|-medium)\.webp$', p.name, re.I):
                  continue

              rel = p.relative_to(root).as_posix()
              match = re.search(r'(?:IMG|PXL|Screenshot|VID)[_-](\d{4})(\d{2})(\d{2})', p.name, re.I)
              date = f'{match.group(1)}-{match.group(2)}-{match.group(3)}' if match else None

              entry = {
                  'name': p.name,
                  'path': rel,
                  'url': 'Images/' + rel,
                  'date': date,
                  'bytes': p.stat().st_size
              }

              if p.suffix.lower() == '.webp':
                  stem = str(p.relative_to(root).with_suffix(''))
                  entry['thumb'] = 'Images/' + stem + '-thumb.webp'
                  entry['medium'] = 'Images/' + stem + '-medium.webp'

              out.append(entry)

          payload = {
              'version': 4,
              'generated': datetime.now(timezone.utc).isoformat(),
              'source': 'Images',
              'count': len(out),
              'photos': out
          }

          Path('photos.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Images photos.json image-optimization-report.json
          if git diff --cached --quiet; then
            echo 'No optimization changes.'
          else
            git commit -m 'chore: compress photos and convert to WebP'
            git push
          fi