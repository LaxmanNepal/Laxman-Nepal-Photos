<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>Laxman Nepal Photos</title>
<meta name="description" content="Laxman Nepal personal photo gallery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--text:#11131a;--muted:#707786;--line:rgba(20,30,50,.09);--blue:#007aff;--glass:rgba(255,255,255,.64)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0,#fff 0,transparent 35%),radial-gradient(circle at 90% 10%,#e7f1ff 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:12px;z-index:20;width:min(1180px,calc(100% - 24px));margin:12px auto 0;padding:12px 14px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:24px;background:var(--glass);backdrop-filter:blur(25px) saturate(170%);-webkit-backdrop-filter:blur(25px) saturate(170%);box-shadow:0 12px 40px rgba(25,35,55,.09)}.brand{display:flex;align-items:center;gap:10px;min-width:max-content}.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#111,#626b7b);box-shadow:0 8px 20px #0002}.brand b{display:block;font-size:14px}.brand span{display:block;font-size:10px;color:var(--muted)}.search{position:relative;flex:1}.search input{width:100%;height:43px;border:1px solid var(--line);border-radius:15px;background:#ffffff9e;outline:0;padding:0 15px 0 40px}.search input:focus{background:#fff;border-color:#007aff55;box-shadow:0 0 0 4px #007aff10}.search svg{position:absolute;left:14px;top:13px;color:#89909e}.refresh{width:43px;height:43px;border:1px solid var(--line);border-radius:15px;background:var(--glass);cursor:pointer}.refresh:hover{transform:translateY(-2px);background:#fff}main{width:min(1180px,calc(100% - 24px));margin:auto;padding:35px 0 70px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:center;margin-bottom:25px}.hero h1{font-size:clamp(38px,5vw,64px);line-height:.98;letter-spacing:-.055em;margin:12px 0}.hero p{max-width:650px;color:var(--muted);line-height:1.65;font-size:14px}.eyebrow{color:var(--blue);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.heroCard{padding:23px;border-radius:29px;border:1px solid #fff;background:linear-gradient(145deg,#ffffffcc,#ffffff66);backdrop-filter:blur(22px);box-shadow:0 18px 55px #1c253a1c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}.stat{padding:12px;border-radius:17px;background:#ffffff8c;border:1px solid var(--line)}.stat b{display:block;font-size:21px}.stat small{color:var(--muted);font-size:9px}.toolbar{position:sticky;top:82px;z-index:10;display:flex;gap:8px;margin-bottom:18px;padding:8px;border:1px solid var(--line);border-radius:21px;background:#ffffff99;backdrop-filter:blur(20px);overflow:auto}.chip{white-space:nowrap;padding:10px 14px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}.chip.active,.chip:hover{background:#fff;color:var(--blue);box-shadow:0 5px 16px #1e283c12}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;background:#e5e8ee;border:1px solid #fff;box-shadow:0 9px 28px #14203a12;cursor:pointer;animation:rise .55s both}.card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .4s}.card:hover img{transform:scale(1.05)}.card:hover{transform:translateY(-4px);box-shadow:0 20px 45px #14203a22}.shade{position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#000b)}.meta{position:absolute;bottom:12px;left:13px;right:13px;color:#fff}.meta b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{font-size:9px;opacity:.8}.fav{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;border-radius:12px;background:#ffffffaa;backdrop-filter:blur(10px);cursor:pointer;font-size:17px}.fav.active{color:#ff375f;background:#fff}.loading,.empty{grid-column:1/-1;text-align:center;padding:70px;color:var(--muted)}.spinner{width:28px;height:28px;margin:auto;border:3px solid #007aff22;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}.viewer{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f4f6facc;backdrop-filter:blur(27px);opacity:0;visibility:hidden;transition:.35s}.viewer.open{opacity:1;visibility:visible}.stage{position:relative;width:min(96vw,1200px);height:min(92vh,900px);display:grid;place-items:center}.viewer img{max-width:90%;max-height:82%;object-fit:contain;border-radius:22px;box-shadow:0 30px 90px #0003;transition:transform .4s}.vbtn{position:absolute;width:48px;height:48px;border:1px solid #fff;border-radius:16px;background:#ffffffb8;backdrop-filter:blur(18px);font-size:25px;cursor:pointer;z-index:2}.vbtn:hover{background:#fff;transform:scale(1.06)}.close{right:0;top:0}.prev{left:0;top:50%}.next{right:0;top:50%}.bottom{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 90px));padding:11px 14px;border:1px solid #fff;border-radius:19px;background:#ffffffaa;backdrop-filter:blur(22px);display:flex;align-items:center;justify-content:space-between;gap:10px}.bottom b{display:block;font-size:11px}.bottom span{font-size:9px;color:var(--muted)}.actions{display:flex;gap:6px}.actions button{position:static;width:38px;height:38px;font-size:17px}.toast{position:fixed;z-index:200;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;padding:10px 15px;border-radius:14px;background:#191c23e8;color:#fff;font-size:11px;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.hero{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.brand span,.refresh{display:none}.top{top:8px;margin-top:8px}.hero{margin-top:10px}.hero h1{font-size:40px}.heroCard{border-radius:23px}.toolbar{top:70px}.gallery{grid-template-columns:repeat(2,1fr);gap:8px}.card{border-radius:17px}.viewer img{max-width:95%;max-height:76%}.prev{left:7px}.next{right:7px}.bottom{width:calc(100% - 70px);bottom:6px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">✦</div><div><b>Laxman Nepal</b><span>Personal Photo Library</span></div></div><label class="search"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Search photos…"></label><button class="refresh" id="refresh">↻</button></header>
<main><section class="hero"><div><span class="eyebrow">Your memories</span><h1>A calmer way to browse your photos.</h1><p>Your photos, automatically organized into a smooth iPhone-inspired glass gallery.</p></div><div class="heroCard"><span class="eyebrow">Library</span><h2 style="margin:8px 0 0">Photo Collection</h2><div id="status" style="font-size:11px;color:var(--muted);margin-top:4px">Loading…</div><div class="stats"><div class="stat"><b id="total">—</b><small>Photos</small></div><div class="stat"><b id="dates">—</b><small>Dates</small></div><div class="stat"><b id="likes">0</b><small>Favorites</small></div></div></div></section>
<div class="toolbar"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="recent">Recent</button><button class="chip" data-filter="favorites">Favorites</button><button class="chip" data-filter="2025">2025</button><button class="chip" data-filter="2024">2024</button></div>
<section id="gallery" class="gallery"><div class="loading"><div class="spinner"></div><div style="margin-top:12px">Loading photos…</div></div></section></main>
<div class="viewer" id="viewer"><div class="stage"><button class="vbtn close" id="close">×</button><button class="vbtn prev" id="prev">‹</button><img id="viewerImg" alt=""><button class="vbtn next" id="next">›</button><div class="bottom"><div><b id="vname">Photo</b><span id="vmeta">—</span></div><div class="actions"><button class="vbtn" id="zoom">＋</button><button class="vbtn" id="vfav">♡</button><button class="vbtn" id="download">↓</button></div></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
const API='https://api.github.com/repos/LaxmanNepal/Laxman-Nepal-Photos/contents/Images?ref=main';
const CDN='https://cdn.jsdelivr.net/gh/LaxmanNepal/Laxman-Nepal-Photos@main/Images/';
const $=id=>document.getElementById(id),gallery=$('gallery');let photos=[],shown=[],pos=0,filter='all',zoomed=false;
let favs=new Set(JSON.parse(localStorage.getItem('laxman-photo-favorites')||'[]'));
const dateOf=n=>{let m=n.match(/(?:IMG|PXL|Screenshot|VID)[_-](\d{4})(\d{2})(\d{2})/i);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const dateText=d=>d?d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'Photo';
const toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1600)};
async function load(){gallery.innerHTML='<div class="loading"><div class="spinner"></div><div style="margin-top:12px">Loading photos…</div></div>';try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('GitHub image list unavailable');let data=await r.json();photos=data.filter(x=>x.type==='file'&&/\.(jpe?g|png|webp|gif|bmp)$/i.test(x.name)).map(x=>{let d=dateOf(x.name);return{id:x.sha,name:x.name,size:x.size||0,date:d,url:CDN+encodeURIComponent(x.name)};});photos.sort((a,b)=>(b.date?.getTime()||0)-(a.date?.getTime()||0)||a.name.localeCompare(b.name));$('total').textContent=photos.length;$('dates').textContent=new Set(photos.filter(p=>p.date).map(p=>p.date.toDateString())).size;$('likes').textContent=favs.size;$('status').textContent=photos.length+' photos · Images folder';render()}catch(e){gallery.innerHTML='<div class="empty"><b>Could not load photos</b><br><small>'+e.message+'</small></div>';$('status').textContent='Unable to load library';}}
function render(){let q=$('search').value.trim().toLowerCase();shown=photos.filter((p,i)=>{let f=filter==='all'||(filter==='recent'&&i<12)||(filter==='favorites'&&favs.has(p.id))||String(p.date?.getFullYear())===filter;return f&&(!q||p.name.toLowerCase().includes(q))});gallery.innerHTML='';if(!shown.length){gallery.innerHTML='<div class="empty"><b>No photos found</b><br><small>Try another filter or search.</small></div>';return}shown.forEach((p,i)=>{let c=document.createElement('article');c.className='card';c.style.animationDelay=Math.min(i*18,300)+'ms';c.innerHTML='<img loading="lazy" src="'+p.url+'" alt="'+p.name+'"><button class="fav '+(favs.has(p.id)?'active':'')+'">'+(favs.has(p.id)?'♥':'♡')+'</button><div class="shade"></div><div class="meta"><b>'+p.name.replace(/\.[^.]+$/,'')+'</b><small>'+dateText(p.date)+'</small></div>';c.querySelector('img').onerror=()=>{c.querySelector('img').src='https://raw.githubusercontent.com/LaxmanNepal/Laxman-Nepal-Photos/main/Images/'+encodeURIComponent(p.name)};c.querySelector('.fav').onclick=e=>{e.stopPropagation();toggleFav(p)};c.onclick=()=>open(i);gallery.appendChild(c)})}
function toggleFav(p){favs.has(p.id)?favs.delete(p.id):favs.add(p.id);localStorage.setItem('laxman-photo-favorites',JSON.stringify([...favs]));$('likes').textContent=favs.size;render()}
function open(i){pos=i;zoomed=false;$('viewer').classList.add('open');document.body.style.overflow='hidden';show()}
function show(){let p=shown[pos];if(!p)return;$('viewerImg').src=p.url;$('viewerImg').alt=p.name;$('viewerImg').style.transform='scale(1)';$('vname').textContent=p.name;$('vmeta').textContent=dateText(p.date);$('vfav').textContent=favs.has(p.id)?'♥':'♡'}
function move(n){pos=(pos+n+shown.length)%shown.length;show()}
$('close').onclick=()=>{$('viewer').classList.remove('open');document.body.style.overflow='';$('viewerImg').src=''};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('vfav').onclick=()=>{toggleFav(shown[pos]);show()};$('zoom').onclick=()=>{zoomed=!zoomed;$('viewerImg').style.transform=zoomed?'scale(1.7)':'scale(1)'};$('download').onclick=()=>{let p=shown[pos],a=document.createElement('a');a.href=p.url;a.download=p.name;a.target='_blank';a.click()};document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});$('search').oninput=render;$('refresh').onclick=load;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});load();
})();
</script></body></html>
